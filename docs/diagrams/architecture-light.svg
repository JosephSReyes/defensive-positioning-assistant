<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 850" width="1120" height="850" role="img" aria-labelledby="ttl dsc">
<title id="ttl">System architecture</title><desc id="dsc">A static vanilla-JavaScript browser client sits above a dashed trust boundary. Below it, three serverless functions hold the only API key and make every OpenAI call.</desc>
<defs><marker id="a" viewBox="0 0 10 8" refX="9.5" refY="4" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#7b93a5"></path></marker><marker id="ag" viewBox="0 0 10 8" refX="9.5" refY="4" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#b98a1c"></path></marker><marker id="agr" viewBox="0 0 10 8" refX="9.5" refY="4" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#0f7a4c"></path></marker><marker id="ard" viewBox="0 0 10 8" refX="9.5" refY="4" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 Z" fill="#b8382f"></path></marker></defs>
<rect x="0.5" y="0.5" width="1119" height="849" rx="16" fill="#ffffff" stroke="#d5dde4"></rect>
<text x="36" y="54" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#0a1b27" text-anchor="start">System architecture</text><text x="36" y="80" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#3f5464" text-anchor="start">Static client · serverless trust boundary · the model never decides where a fielder stands</text><circle cx="729.6" cy="58" r="5" fill="#0f7a4c"></circle><text x="742.6" y="62" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#3f5464" text-anchor="start">Deterministic code</text><circle cx="890.4000000000001" cy="58" r="5" fill="#96650a"></circle><text x="903.4000000000001" y="62" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#3f5464" text-anchor="start">Model path</text><circle cx="998.4000000000001" cy="58" r="5" fill="#4d6578"></circle><text x="1011.4000000000001" y="62" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#3f5464" text-anchor="start">Third-party</text><rect x="36" y="104" width="780" height="312" rx="14" fill="#f4f7f9" stroke="#dde5ea"></rect><text x="60" y="134" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#63798a" text-anchor="start" letter-spacing="1.25">BROWSER — STATIC SITE · VANILLA JS · ZERO RUNTIME DEPENDENCIES</text><rect x="60" y="160" width="222" height="96" rx="11" fill="#ffffff" stroke="#c8d4dd" stroke-width="1"></rect><rect x="69" y="171" width="3.5" height="74" rx="1.75" fill="#0f7a4c"></rect><text x="82" y="187" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0f7a4c" text-anchor="start" letter-spacing="1.3">PRESENTATION</text><text x="82" y="208" font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12.5" font-weight="500" fill="#0a1b27" text-anchor="start">ui.js · batter.js</text><text x="82" y="227" font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12.5" font-weight="500" fill="#0a1b27" text-anchor="start">spray-charts.js</text><text x="82" y="244" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#63798a" text-anchor="start">field + spray charts</text><rect x="315" y="160" width="222" height="96" rx="11" fill="#ffffff" stroke="#c8d4dd" stroke-width="1"></rect><rect x="324" y="171" width="3.5" height="74" rx="1.75" fill="#0f7a4c"></rect><text x="337" y="187" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0f7a4c" text-anchor="start" letter-spacing="1.3">DOMAIN — RULES ENGINE</text><text x="337" y="208" font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12.5" font-weight="500" fill="#0a1b27" text-anchor="start">game.js</text><text x="337" y="227" font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12.5" font-weight="500" fill="#0a1b27" text-anchor="start">recommendations.js</text><text x="337" y="244" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#63798a" text-anchor="start">owns every recommendation</text><rect x="570" y="160" width="222" height="96" rx="11" fill="#ffffff" stroke="#c8d4dd" stroke-width="1"></rect><rect x="579" y="171" width="3.5" height="74" rx="1.75" fill="#0f7a4c"></rect><text x="592" y="187" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0f7a4c" text-anchor="start" letter-spacing="1.3">PERSISTENCE</text><text x="592" y="208" font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12.5" font-weight="500" fill="#0a1b27" text-anchor="start">storage.js</text><text x="592" y="226" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#63798a" text-anchor="start">sole localStorage owner,</text><text x="592" y="244" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#63798a" text-anchor="start">schema-validated on read</text><rect x="60" y="304" width="477" height="88" rx="11" fill="#ffffff" stroke="#c8d4dd" stroke-width="1"></rect><rect x="69" y="315" width="3.5" height="66" rx="1.75" fill="#0f7a4c"></rect><text x="82" y="331" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#0f7a4c" text-anchor="start" letter-spacing="1.3">INGESTION</text><text x="82" y="352" font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12.5" font-weight="500" fill="#0a1b27" text-anchor="start">roster-import.js · play-log-import.js</text><text x="82" y="370" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#63798a" text-anchor="start">the browser computes field coordinates — not the model</text><rect x="570" y="304" width="222" height="88" rx="11" fill="#ffffff" stroke="#c8d4dd" stroke-width="1"></rect><rect x="579" y="315" width="3.5" height="66" rx="1.75" fill="#96650a"></rect><text x="592" y="331" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#96650a" text-anchor="start" letter-spacing="1.3">MODEL CLIENT</text><text x="592" y="352" font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12.5" font-weight="500" fill="#0a1b27" text-anchor="start">ai.js</text><text x="592" y="370" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#63798a" text-anchor="start">1-hour response cache</text><path d="M282,208 L315,208" fill="none" stroke="#7b93a5" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"></path><path d="M537,208 L570,208" fill="none" stroke="#7b93a5" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"></path><path d="M426,256 L426.0,268.0 Q426,280 438.0,280.0 L669.0,280.0 Q681,280 681.0,292.0 L681,304" fill="none" stroke="#7b93a5" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"></path><rect x="848" y="160" width="236" height="96" rx="11" fill="#f7f9fa" stroke="#ccd7df" stroke-width="1"></rect><rect x="857" y="171" width="3.5" height="74" rx="1.75" fill="#4d6578"></rect><text x="870" y="187" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#4d6578" text-anchor="start" letter-spacing="1.3">THIRD-PARTY</text><text x="870" y="209" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#0a1b27" text-anchor="start">Hosted auth + billing</text><text x="870" y="229" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#63798a" text-anchor="start">gates the app; it never sees</text><text x="870" y="245" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#63798a" text-anchor="start">rosters or game data</text><path d="M816,208 L848,208" stroke="#7b93a5" stroke-width="1.6" stroke-dasharray="5 5"></path><rect x="36" y="496" width="780" height="186" rx="14" fill="#f4f7f9" stroke="#dde5ea"></rect><text x="60" y="526" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#63798a" text-anchor="start" letter-spacing="1.25">SERVERLESS FUNCTIONS — THE ONLY PRIVILEGED CODE PATH</text><rect x="60" y="554" width="222" height="104" rx="11" fill="#ffffff" stroke="#c8d4dd" stroke-width="1"></rect><rect x="69" y="565" width="3.5" height="82" rx="1.75" fill="#96650a"></rect><text x="82" y="581" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#96650a" text-anchor="start" letter-spacing="1.3">VISION EXTRACTION</text><text x="82" y="602" font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12.5" font-weight="500" fill="#0a1b27" text-anchor="start">openai-roster-import</text><text x="82" y="620" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#63798a" text-anchor="start">gpt-4o · detail: high</text><text x="82" y="638" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#63798a" text-anchor="start">10 req/min/IP</text><rect x="315" y="554" width="222" height="104" rx="11" fill="#ffffff" stroke="#c8d4dd" stroke-width="1"></rect><rect x="324" y="565" width="3.5" height="82" rx="1.75" fill="#96650a"></rect><text x="337" y="581" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#96650a" text-anchor="start" letter-spacing="1.3">VISION EXTRACTION</text><text x="337" y="602" font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12.5" font-weight="500" fill="#0a1b27" text-anchor="start">openai-play-log-import</text><text x="337" y="620" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#63798a" text-anchor="start">gpt-4o · multi-image</text><text x="337" y="638" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#63798a" text-anchor="start">5 req/min/IP · 12 max</text><rect x="570" y="554" width="222" height="104" rx="11" fill="#ffffff" stroke="#c8d4dd" stroke-width="1"></rect><rect x="579" y="565" width="3.5" height="82" rx="1.75" fill="#96650a"></rect><text x="592" y="581" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="700" fill="#96650a" text-anchor="start" letter-spacing="1.3">PHRASING ONLY</text><text x="592" y="602" font-family="ui-monospace, SFMono-Regular, &#39;SF Mono&#39;, Menlo, Consolas, &#39;Liberation Mono&#39;, monospace" font-size="12.5" font-weight="500" fill="#0a1b27" text-anchor="start">ai-coach-brief</text><text x="592" y="620" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#63798a" text-anchor="start">gpt-4o-mini · 150 tokens</text><text x="592" y="638" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#63798a" text-anchor="start">30 req/min/IP</text><path d="M171,392 L171,554" fill="none" stroke="#b98a1c" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ag)"></path><path d="M426,392 L426,554" fill="none" stroke="#b98a1c" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ag)"></path><path d="M681,392 L681,554" fill="none" stroke="#b98a1c" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ag)"></path><text x="181" y="428" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3f5464" text-anchor="start">lineup card photo</text><text x="436" y="428" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3f5464" text-anchor="start">play-log screenshots</text><text x="691" y="428" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#3f5464" text-anchor="start">finished recommendation</text><path d="M36,456 L1084,456" stroke="#96650a" stroke-width="2" stroke-dasharray="9 7"></path><rect x="352" y="440" width="416" height="32" rx="16" fill="#ffffff" stroke="#96650a" stroke-width="1.5"></rect><text x="560" y="461" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#96650a" text-anchor="middle" letter-spacing="1.1">TRUST BOUNDARY — NO API KEY EXISTS ABOVE THIS LINE</text><rect x="848" y="554" width="236" height="118" rx="11" fill="#f4f7f9" stroke="#96650a" stroke-width="1" stroke-opacity="0.5"></rect><text x="868" y="580" font-family="-apple-system, BlinkMacSyste