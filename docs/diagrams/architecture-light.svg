oke-width="1.8" stroke-linecap="round" marker-end="url(#ag)"></path><path d="M681,658 L681.0,694.0 Q681,706 669.0,706.0 L528.0,706.0 Q516,706 516.0,718.0 L516,740" fill="none" stroke="#b98a1c" stroke-width="1.8" stroke-linecap="round" marker-end="url(#ag)"></path><text x="620" y="772" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#3f5464" text-anchor="start">Every model call crosses the boundary.</text><text x="620" y="792" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#63798a" text-anchor="start">No recommendation depends on one.</text>
